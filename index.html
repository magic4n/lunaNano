<!DOCTYPE html>
<html lang="en" class="dark h-full w-full overflow-hidden select-none bg-black text-white">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LunaNano — Wayland React Shell</title>
  
  <!-- Material Symbols & Fonts: Google Sans / Open Sans / Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Open+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    
    :root {
      --luna-screen-radius: 16px;
      /* Dynamic M3 Theme Tokens fallback */
      --md-sys-color-primary: #a8c7fa;
      --md-sys-color-on-primary: #04316a;
      --md-sys-color-primary-container: #0842a0;
      --md-sys-color-on-primary-container: #d3e3fd;
      --md-sys-color-secondary: #c2c7cf;
      --md-sys-color-on-secondary: #2c3137;
      --md-sys-color-secondary-container: #42474e;
      --md-sys-color-on-secondary-container: #dee3eb;
      --md-sys-color-tertiary: #dfb8d8;
      --md-sys-color-on-tertiary: #40233e;
      --md-sys-color-tertiary-container: #583955;
      --md-sys-color-on-tertiary-container: #fcd7f5;
      --md-sys-color-surface: #121316;
      --md-sys-color-on-surface: #e2e2e6;
      --md-sys-color-surface-variant: #44474e;
      --md-sys-color-on-surface-variant: #c4c7d0;
      --md-sys-color-outline: #8e9099;
      --md-sys-color-outline-variant: #44474e;
      --md-sys-color-background: #090a0c;
      --md-sys-color-on-background: #e2e2e6;
      --md-sys-color-surface-container: #1e1f23;
      --md-sys-color-surface-container-high: #282a2e;
      --md-sys-color-surface-container-highest: #333539;
      --md-sys-color-error: #ffb4ab;
      --md-sys-color-on-error: #690005;
      
      --md-sys-typescale-body-large-font: 'Montserrat', 'Open Sans', system-ui, sans-serif;
    }

    html, body, #root {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: var(--md-sys-color-background);
      color: var(--md-sys-color-on-background);
      font-family: 'Montserrat', 'Open Sans', system-ui, -apple-system, sans-serif;
    }

    /* Screen corner radius */
    body {
      border-radius: var(--luna-screen-radius);
    }
    
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }

    .material-symbols-outlined.fill {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.4);
    }
  </style>
</head>
<body class="antialiased overflow-hidden">
  <div id="root" class="h-full w-full relative"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
