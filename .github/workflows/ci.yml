name: CI/CD Build & Package

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-and-package:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libseat-dev \
            libinput-dev \
            libudev-dev \
            libgbm-dev \
            libdrm-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            dpkg-dev \
            patchelf \
            xwayland

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build React Shell Bundle
        run: npm run build

      - name: Build Wayland Compositor (Release)
        run: cargo build --release -p lunanano-compositor

      - name: Package Debian (.deb)
        run: |
          chmod +x packaging/build-deb.sh packaging/lunanano-session
          ./packaging/build-deb.sh

      - name: Upload Debian Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lunanano-deb
          path: artifacts/*.deb

      - name: Create GitHub Release and Attach .deb
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
