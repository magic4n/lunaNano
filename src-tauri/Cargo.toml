[package]
name = "lunanano-shell"
version = "0.1.0"
description = "LunaNano Desktop Shell Tauri Layer-Shell Wrapper"
authors = ["superLuna Ecosystem"]
license = "GPL-3.0-or-later"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", default-features = false }

[dependencies]
tauri = { version = "1.8", default-features = false, features = ["wry"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
