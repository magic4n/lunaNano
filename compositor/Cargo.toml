[package]
name = "lunanano-compositor"
version = "0.1.0"
edition = "2021"
authors = ["superLuna Ecosystem"]
description = "LunaNano Wayland Compositor & System Bridge"

[dependencies]
tokio = { version = "1.37", features = ["full"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
portable-pty = "0.9"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
walkdir = "2.4"
zip = { version = "1.1", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1.0"
sevenz-rust = "0.6"
notify = "6.1"
